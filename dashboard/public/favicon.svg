  <path d="M0 65 Q30 60 60 68 Q80 72 100 65 L100 100 L0 100 Z" fill="#4d7c0f" opacity="0.8"/>
  <path d="M0 78 Q40 72 70 80 Q90 84 100 78 L100 100 L0 100 Z" fill="#365314" opacity="0.9"/>
