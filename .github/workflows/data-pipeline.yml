name: Data Pipeline - Process Land Prices

on:
  schedule:
    - cron: '0 6 20 1 *'  # 20 de Janeiro, 6h UTC (dados anuais DERAL)
  # Manual trigger - execute quando novos PDFs forem adicionados
  workflow_dispatch:
    inputs:
      extract_pdfs:
        description: 'Extrair dados dos PDFs'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          # Java para tabula
          sudo apt-get update && sudo apt-get install -y default-jre

      - name: Extract PDFs
        # No cron, inputs.extract_pdfs é vazio — sem o OR a extração nunca
        # rodava nas execuções agendadas. Sem '|| true': falha deve falhar.
        if: ${{ github.event_name == 'schedule' || inputs.extract_pdfs }}
        run: |
          python scripts/extract_pdfs.py
          python scripts/parse_pdfs.py

      - name: Preprocess data
        run: |
          python scripts/preprocess_data.py

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update land prices data [skip ci]"
          git push

      - name: Trigger deploy workflow
        # O [skip ci] (e o GITHUB_TOKEN) impedem o deploy automático no push
        # do bot; o dispatch garante que o site acompanhe os dados novos.
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
